plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.rileygramlich.yap'
    compileSdk 36
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'dev.rileygramlich.yap'
        minSdk 26
        targetSdk 36
        versionCode 3
        versionName '0.2.1'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release' }
        }
    }

    buildTypes {
        // whisper is unusably slow unoptimised, so debug builds compile native code in release mode too.
        debug { externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } } }
        release { minifyEnabled false }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.31.6' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The model is already compressed; storing it uncompressed makes install and first launch faster.
    androidResources { noCompress 'bin' }
}
