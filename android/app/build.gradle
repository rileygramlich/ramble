plugins {
    id 'com.android.application'
}

android {
    namespace 'dev.rileygramlich.yap'
    compileSdk 36
    ndkVersion '29.0.14206865'

    defaultConfig {
        applicationId 'dev.rileygramlich.yap'
        minSdk 26
        targetSdk 36
        versionCode 7
        versionName '0.5.0'
        ndk { abiFilters 'arm64-v8a' }
        externalNativeBuild {
            cmake { arguments '-DANDROID_STL=c++_static', '-DCMAKE_BUILD_TYPE=Release' }
        }
    }

    // The release key lives outside git, in ~/.config/yap-signing/keystore.properties
    // (or wherever YAP_SIGNING points). Every release is signed with it, so a new
    // APK installs over the last one whichever machine built it. Back it up: lose
    // it and the next release needs an uninstall.
    def signing = new Properties()
    def signingFile = file(System.getenv('YAP_SIGNING') ?: "${System.getProperty('user.home')}/.config/yap-signing/keystore.properties")
    if (signingFile.exists()) signingFile.withInputStream { signing.load(it) }

    signingConfigs {
        release {
            if (signing.storeFile) {
                storeFile file(signing.storeFile)
                storePassword signing.storePassword
                keyAlias signing.keyAlias
                keyPassword signing.keyPassword
            }
        }
    }

    buildTypes {
        // whisper is unusably slow unoptimised, so debug builds compile native code in release mode too.
        debug { externalNativeBuild { cmake { arguments '-DCMAKE_BUILD_TYPE=Release' } } }
        release { minifyEnabled false; signingConfig signing.storeFile ? signingConfigs.release : null }
    }

    externalNativeBuild {
        cmake { path 'src/main/cpp/CMakeLists.txt'; version '3.31.6' }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The model is already compressed; storing it uncompressed makes install and first launch faster.
    androidResources { noCompress 'bin' }
}
