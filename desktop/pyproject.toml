[project]
name = "ramble"
version = "0.8.0"
description = "Free, private, open-source dictation for every device: hold a key (or tap the bubble), talk, and it types."
license = "MIT"
requires-python = ">=3.11,<3.14"
dependencies = [
  "numpy",
  "sounddevice",
  "pynput",
  "pyperclip",
  "faster-whisper",
  "evdev; sys_platform == 'linux'",
  "mlx-whisper; sys_platform == 'darwin' and platform_machine == 'arm64'",
  "pyobjc-framework-Cocoa; sys_platform == 'darwin'",  # the Mac bubble
]

[project.optional-dependencies]
# NVIDIA GPUs on Linux and Windows: CUDA's maths libraries, so Whisper runs on the
# card (about 13x faster for large-v3-turbo). Install with: uv sync --extra gpu
gpu = [
  "nvidia-cublas-cu12; sys_platform != 'darwin'",
  "nvidia-cudnn-cu12==9.*; sys_platform != 'darwin'",
]

[project.scripts]
ramble = "ramble.__main__:main"
# The old name, so existing installs and services keep working.
yap = "ramble.__main__:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
